name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Auto Version Tag from PR Title"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore LaunchBoxRommPlugin.slnx

      - name: Extract version from tag
        id: vars
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${env:GITHUB_REF_NAME}"
          } else {
            git fetch --tags
            $version = git describe --tags --abbrev=0
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Solution (Release)
        run: msbuild LaunchBoxRommPlugin.slnx /p:Configuration=Release /p:Version=${{ steps.vars.outputs.VERSION }}

      - name: Create package folder structure
        shell: cmd
        run: |
          mkdir package
          mkdir "package\RomM LaunchBox Integration"

      - name: Copy required binaries
        shell: cmd
        run: |
          copy build\Release\Newtonsoft.Json.dll "package\RomM LaunchBox Integration\"
          copy build\Release\RommPlugin.CLI.exe "package\RomM LaunchBox Integration\"
          copy build\Release\RommPlugin.CLI.exe.config "package\RomM LaunchBox Integration\"
          copy build\Release\RommPlugin.Core.dll "package\RomM LaunchBox Integration\"
          copy build\Release\RommPlugin.dll "package\RomM LaunchBox Integration\"
          copy build\Release\RommPlugin.dll.config "package\RomM LaunchBox Integration\"
          copy build\Release\RommPlugin.UI.dll "package\RomM LaunchBox Integration\"

      - name: Copy Images folder
        shell: cmd
        run: |
          xcopy Images "package\RomM LaunchBox Integration\Images\" /E /I /Y

      - name: Copy Locales folder
        shell: cmd
        run: |
          xcopy build\Release\Locales "package\RomM LaunchBox Integration\Locales\" /E /I /Y

      - name: Create ZIP with version
        shell: powershell
        run: |
          $zipName = "launchbox-romm-plugin-${{ steps.vars.outputs.VERSION }}.zip"
          Compress-Archive -Path package\* -DestinationPath $zipName

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configurationJson: |
            {
              "pr_template": "- #{{TITLE}} (##{{NUMBER}})",
              "categories": [
                {
                  "title": "💥 New Version",
                  "rules": [
                    { "pattern": "^breaking", "on_property": "title" },
                    { "pattern": "^version", "on_property": "title" }
                  ]
                },
                {
                  "title": "🚀 Features",
                  "rules": [
                    { "pattern": "^feat", "on_property": "title" }
                  ]
                },
                {
                  "title": "🐛 Fixes",
                  "rules": [
                    { "pattern": "^fix", "on_property": "title" },
                    { "pattern": "^bug", "on_property": "title" }
                  ]
                },
                {
                  "title": "🧰 Maintenance",
                  "rules": [
                    { "pattern": "^refactor", "on_property": "title" },
                    { "pattern": "^chore", "on_property": "title" }
                  ]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: launchbox-romm-plugin-${{ steps.vars.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}